name: Sync catalog and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
permissions:
  contents: read
concurrency:
  group: production-website
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'samutaan/tokyo-anime-music' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_SITE_URL: https://tokyo-anime-music.web.app
      PUBLIC_ALLOW_INDEXING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:sync
      - name: Sync verified Apple catalog
        if: github.event_name != 'push'
        run: pnpm sync:apply
      - run: pnpm build
      - name: Record sync report
        if: github.event_name != 'push'
        run: |
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("work/sync-report.json"));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,JSON.stringify(r,null,2));'
      - name: Commit validated catalog only
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- src/data/releases.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/releases.json
          git commit -m 'Update verified Apple catalog'
          git push
      - name: Deploy static site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOKYO_ANIME_MUSIC }}
          channelId: live
          projectId: tokyo-anime-music
